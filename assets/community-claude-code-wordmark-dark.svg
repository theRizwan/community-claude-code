<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="600" height="140" fill="none">
  <defs>
    <linearGradient id="brandGradLight" x1="20" y1="20" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7F3F" />
      <stop offset="100%" stop-color="#D9531E" />
    </linearGradient>
    <linearGradient id="surfaceGradLight" x1="20" y1="20" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2028" />
      <stop offset="100%" stop-color="#13151A" />
    </linearGradient>
  </defs>

  <!-- Minimalist App-Tile Emblem -->
  <rect x="20" y="20" width="100" height="100" rx="22" fill="url(#surfaceGradLight)" stroke="#D0D7DE" stroke-width="2" />
  <rect x="21" y="21" width="98" height="98" rx="21" stroke="url(#brandGradLight)" stroke-opacity="0.55" stroke-width="1.5" />

  <!-- Geometric "C" Terminal Mark -->
  <path d="M74 44H54C46.268 44 40 50.268 40 58V82C40 89.732 46.268 96 54 96H74" stroke="url(#brandGradLight)" stroke-width="9" stroke-linecap="round" />
  <path d="M68 58L82 70L68 82" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="88" y1="82" x2="98" y2="82" stroke="#FF7F3F" stroke-width="8" stroke-linecap="round" />

  <!-- Dark Wordmark for Light Backgrounds -->
  <text x="148" y="83" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, &#39;Inter&#39;, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="600" letter-spacing="-1">
    Claude Code
  </text>

  <!-- Subtle Vertical Divider -->
  <line x1="406" y1="48" x2="406" y2="92" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />

  <!-- Crisp Pill Badge for "Community" -->
  <rect x="428" y="51" width="146" height="38" rx="19" fill="#FF7F3F" fill-opacity="0.12" stroke="#D9531E" stroke-opacity="0.35" stroke-width="1.5" />
  <text x="501" y="75" text-anchor="middle" fill="#C2410C" font-family="-apple-system, BlinkMacSystemFont, &#39;Inter&#39;, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="0.8">
    COMMUNITY
  </text>
</svg>